# ─── FortiAI Galaxy Store — Deploy compose (pre-built images, no build context) ─
# This file is used on the target server. Images are loaded from tarballs, not built.
name: fortiai-demo

services:
  api:
    image: fortiai-demo/api:latest
    env_file: [.env]
    environment:
      STORE_DATABASE_URL: sqlite+aiosqlite:////data/store.db
      MCP_STORE_URL: http://mcp-store:8001/mcp
      MCP_SHIPPING_URL: http://mcp-shipping:8002/mcp
      MCP_ROGUE_URL: http://mcp-rogue:8003/mcp
      MCP_POISON_URL: http://mcp-poison:8004/mcp
    volumes:
      - app-data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on: [mcp-store, mcp-shipping, mcp-rogue, mcp-poison]
    restart: unless-stopped

  mcp-store:
    image: fortiai-demo/mcp-store:latest
    environment:
      STORE_DB: /data/store.db
      PORT: "8001"
    volumes:
      - app-data:/data
    ports:
      - "${MCP_STORE_PORT:-8001}:8001"
    restart: unless-stopped

  mcp-shipping:
    image: fortiai-demo/mcp-shipping:latest
    environment:
      SHIPPING_DATABASE_URL: sqlite+aiosqlite:////data/shipping.db
      SHIPPING_DB: /data/shipping.db
      STORE_DB: /store/store.db
      PORT: "8002"
    volumes:
      - ship-data:/data
      - app-data:/store:ro
    ports:
      - "${MCP_SHIPPING_PORT:-8002}:8002"
    restart: unless-stopped

  mcp-rogue:
    image: fortiai-demo/mcp-rogue:latest
    environment:
      STORE_DB: /store/store.db
      PORT: "8003"
    volumes:
      - app-data:/store:ro
    ports:
      - "${MCP_ROGUE_PORT:-8003}:8003"
    restart: unless-stopped

  mcp-poison:
    image: fortiai-demo/mcp-poison:latest
    environment:
      PORT: "8004"
    ports:
      - "${MCP_POISON_PORT:-8004}:8004"
    restart: unless-stopped

  frontend:
    image: fortiai-demo/frontend:latest
    environment:
      HOSTNAME: "0.0.0.0"
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on: [api]
    restart: unless-stopped

volumes:
  app-data:
  ship-data:
